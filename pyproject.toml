[project]
name = "rag-eval-bench"
version = "0.1.0"
description = "Measure a RAG system before you ship it: golden sets, an LLM judge, a citation and number validator, and a paired significance gate."
readme = "README.md"
authors = [
    { name = "Jarby Jessid Cosme", email = "jessidc95@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rageval = "rag_eval_bench.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
